[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nymrel-marketproof"
version = "0.1.0"
description = "Read-only evidence receipts over CoinMarketCap market data"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nymrel", email = "contact@nymrel.com" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
